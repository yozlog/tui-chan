[package]
name = "tui-chan"
version = "0.5.0"
authors = ["tuqqu <artkurbidaev@gmail.com>"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.7", features = ["json", "native-tls-alpn"]  }
tokio = { version = "1.36.0", features = ["rt-multi-thread", "macros", "time"], default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tui = { version = "0.16", default-features = false, features = ["crossterm"] }
crossterm = "0.25"
chrono = "0.4"
htmlescape="0.3"
clipboard = "0.5"
open = "1"
image = "0.24"
fuzzy-matcher = "0.3.7"


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
